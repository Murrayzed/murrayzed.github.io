<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给柚柚</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
  }

  /* 星星背景 */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--duration) ease-in-out infinite;
    animation-delay: var(--delay);
    opacity: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* 飘落的花瓣 */
  .petal {
    position: fixed;
    pointer-events: none;
    font-size: 24px;
    animation: fall var(--fall-duration) linear infinite;
    animation-delay: var(--fall-delay);
    left: var(--x);
    top: -50px;
    opacity: 0.8;
  }
  @keyframes fall {
    0% {
      transform: translateY(0) rotate(0deg) scale(1);
      opacity: 0.8;
    }
    50% {
      opacity: 1;
      transform: translateY(50vh) rotate(180deg) scale(1.3);
    }
    100% {
      transform: translateY(105vh) rotate(360deg) scale(0.6);
      opacity: 0;
    }
  }

  /* 主内容 */
  .container {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 40px;
  }

  .heart-icon {
    font-size: 80px;
    animation: heartbeat 1.2s ease-in-out infinite;
    display: block;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
    45% { transform: scale(1.15); }
    60% { transform: scale(1); }
  }

  .title {
    font-size: 60px;
    font-weight: bold;
    margin: 30px 0;
    background: linear-gradient(90deg, #ff6b6b, #feca57, #ff9ff3, #54a0ff, #5f27cd);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 3s ease infinite;
  }
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .message {
    font-size: 28px;
    color: #dfe6e9;
    line-height: 2;
    animation: fadeInUp 2s ease;
    text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
  }
  .message .highlight {
    color: #ff6b6b;
    font-size: 36px;
    font-weight: bold;
    display: block;
    margin: 15px 0;
    animation: glowPulse 2s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 10px rgba(255, 107, 107, 0.5), 0 0 20px rgba(255, 107, 107, 0.3); }
    50% { text-shadow: 0 0 30px rgba(255, 107, 107, 0.9), 0 0 60px rgba(255, 107, 107, 0.6), 0 0 80px rgba(255, 154, 154, 0.4); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .subtitle {
    margin-top: 40px;
    font-size: 18px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 8px;
    animation: fadeInUp 2.5s ease;
  }

  .floating-hearts {
    position: fixed;
    pointer-events: none;
    z-index: 5;
  }
  .float-heart {
    position: absolute;
    font-size: var(--size);
    animation: rise var(--rise-duration) ease-in infinite;
    animation-delay: var(--rise-delay);
    left: var(--left);
    bottom: -60px;
    opacity: 0;
  }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(0) scale(0.5) rotate(0deg); }
    10% { opacity: 0.9; }
    80% { opacity: 0.6; }
    100% { opacity: 0; transform: translateY(-105vh) scale(1.5) rotate(360deg); }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="container">
  <span class="heart-icon">💝</span>
  <h1 class="title">柚柚</h1>
  <p class="message">
    特别特别想念你
    <span class="highlight">好想好想你</span>
    每一天 每一刻
    <span class="highlight">你是我最珍贵的宝</span>
  </p>
  <p class="subtitle">—— 永远爱你的 Murray</p>
</div>

<script>
  // 星星
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 180; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.width = Math.random() * 3 + 1 + 'px';
    star.style.height = star.style.width;
    star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
    star.style.setProperty('--delay', Math.random() * 5 + 's');
    starsContainer.appendChild(star);
  }

  // 飘落花瓣
  const petals = ['🌸', '💮', '🌷', '🌺', '💐', '🏵️', '🌼', '💖', '✨'];
  function createPetal() {
    const petal = document.createElement('span');
    petal.className = 'petal';
    petal.textContent = petals[Math.floor(Math.random() * petals.length)];
    petal.style.setProperty('--x', Math.random() * 100 + '%');
    petal.style.setProperty('--fall-duration', (Math.random() * 8 + 6) + 's');
    petal.style.setProperty('--fall-delay', Math.random() * 3 + 's');
    document.body.appendChild(petal);

    setTimeout(() => petal.remove(), 15000);
  }
  for (let i = 0; i < 30; i++) {
    setTimeout(createPetal, i * 400);
  }
  setInterval(createPetal, 2000);

  // 底部升起爱心
  const heartChars = ['❤️', '💕', '💗', '💓', '💖'];
  function createFloatHeart() {
    const heart = document.createElement('span');
    heart.className = 'float-heart';
    heart.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
    heart.style.setProperty('--size', (Math.random() * 30 + 16) + 'px');
    heart.style.setProperty('--left', Math.random() * 100 + '%');
    heart.style.setProperty('--rise-duration', (Math.random() * 6 + 4) + 's');
    heart.style.setProperty('--rise-delay', Math.random() * 2 + 's');
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 10000);
  }
  for (let i = 0; i < 20; i++) {
    setTimeout(createFloatHeart, i * 600);
  }
  setInterval(createFloatHeart, 2500);
</script>

</body>
</html>
